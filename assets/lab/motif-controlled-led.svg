<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 128" width="540" height="128" role="img" aria-label="GPIO pulse travelling from a button press to an LED"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/></linearGradient><radialGradient id="lg"><stop offset="0" stop-color="#FFD166" stop-opacity=".9"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></radialGradient></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.fl{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 86;animation:fl 2.6s linear infinite}@keyframes fl{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.press{animation:pr 2.6s ease-out infinite}@keyframes pr{0%,4%{transform:translateY(0)}10%{transform:translateY(3px)}22%,100%{transform:translateY(0)}}.lit{animation:li 2.6s ease-out infinite}@keyframes li{0%,62%{opacity:.14}70%{opacity:1}88%,100%{opacity:.14}}.mcu{animation:mc 2.6s ease-in-out infinite}@keyframes mc{0%,30%{opacity:.3}42%{opacity:1}60%,100%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="540" height="128" rx="9" fill="url(#bg)"/><rect x=".8" y=".8" width="538.4" height="126.4" rx="9" fill="none" stroke="#16354A" stroke-width="1.6"/><text class="mono" x="20" y="24" font-size="10" fill="#4DD0D6" letter-spacing="2">EXP-01 &#183; DIGITAL I/O</text><path d="M92 74H180" stroke="#1F4257" stroke-width="2.6"/><path class="fl" pathLength="100" d="M92 74H180" stroke="#C9D6DF"/><path d="M300 74H400" stroke="#1F4257" stroke-width="2.6"/><path class="fl" pathLength="100" d="M300 74H400" stroke="#FFD166" style="animation-delay:-1.1s"/><g class="press"><rect x="34" y="60" width="42" height="28" rx="5" fill="#18242F" stroke="#C9D6DF" stroke-width="1.8"/><rect x="46" y="52" width="18" height="9" rx="4" fill="#C9D6DF"/></g><text class="mono dim" x="55" y="108" font-size="9" text-anchor="middle">BTN D2</text><rect x="184" y="50" width="112" height="48" rx="5" fill="#12202B" stroke="#00C2CA" stroke-width="1.6"/><rect class="mcu" x="200" y="62" width="80" height="24" rx="3" fill="#00C2CA"/><text class="mono" x="240" y="79" font-size="9.5" fill="#0A101A" text-anchor="middle" letter-spacing="1">digitalRead</text><text class="mono dim" x="240" y="112" font-size="9" text-anchor="middle">ATmega328P</text><circle class="lit" cx="440" cy="74" r="30" fill="url(#lg)"/><path class="lit" d="M440 58l15 22h-30z" fill="#FFD166"/><rect x="433" y="82" width="14" height="6" rx="1" fill="#FFD166" opacity=".6"/><text class="mono dim" x="440" y="108" font-size="9" text-anchor="middle">LED D13</text><text class="mono" x="520" y="24" font-size="9" fill="#3E5464" text-anchor="end" letter-spacing="1.2">HIGH WHILE HELD</text></svg>