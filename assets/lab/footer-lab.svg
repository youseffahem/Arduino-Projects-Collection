<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Laboratory footer panel, systems still running"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/></linearGradient><radialGradient id="fg"><stop offset="0" stop-color="#00979D" stop-opacity=".35"/><stop offset="1" stop-color="#00979D" stop-opacity="0"/></radialGradient></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.fl{fill:none;stroke:#4DD0D6;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 91;animation:fl 7s linear infinite}@keyframes fl{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.bl{animation:bl 3.4s ease-in-out infinite}@keyframes bl{0%,100%{opacity:.22}50%{opacity:1}}.gl{animation:gl 9s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.25}50%{opacity:.6}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="200" rx="10" fill="url(#bg)"/><rect x=".8" y=".8" width="998.4" height="198.4" rx="10" fill="none" stroke="#16354A" stroke-width="1.6"/><ellipse class="gl" cx="500" cy="196" rx="420" ry="90" fill="url(#fg)"/><path d="M40 168H250L282 140H520" fill="none" stroke="#1B3A50" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="fl" pathLength="100" d="M40 168H250L282 140H520" style="animation-delay:-0.00s"/><path d="M40 148H180L212 122H430L458 140H700" fill="none" stroke="#1B3A50" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="fl" pathLength="100" d="M40 148H180L212 122H430L458 140H700" style="animation-delay:-1.35s"/><path d="M960 168H760L728 140H540" fill="none" stroke="#1B3A50" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="fl" pathLength="100" d="M960 168H760L728 140H540" style="animation-delay:-2.70s"/><path d="M960 146H