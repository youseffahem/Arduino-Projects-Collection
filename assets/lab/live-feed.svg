<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 40" width="320" height="40" role="img" aria-label="Live experiment feed indicator"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/></linearGradient><radialGradient id="lf"><stop offset="0" stop-color="#E5484D" stop-opacity=".85"/><stop offset="1" stop-color="#E5484D" stop-opacity="0"/></radialGradient></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.rec{animation:rc 1.8s ease-in-out infinite}@keyframes rc{0%,100%{opacity:.25}50%{opacity:1}}.hal{animation:hl 1.8s ease-in-out infinite}@keyframes hl{0%,100%{opacity:.12}50%{opacity:.45}}.bar{transform-box:fill-box;transform-origin:left center;animation:bw 4s linear infinite}@keyframes bw{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="320" height="40" rx="7" fill="url(#bg)"/><rect x=".8" y=".8" width="318.4" height="38.4" rx="7" fill="none" stroke="#16354A" stroke-width="1.6"/><circle class="hal" cx="26" cy="20" r="16" fill="url(#lf)"/><circle class="rec" cx="26" cy="20" r="6" fill="#E5484D"/><text class="mono" x="44" y="25" font-size="12" fill="#E5484D" letter-spacing="2.6">LIVE</text><path d="M96 10V30" stroke="#16354A" stroke-width="1"/><text class="mono dim" x="108" y="25" font-size="10" letter-spacing="1.6">REC</text><rect x="146" y="17" width="96" height="5" rx="2.5" fill="#1B2A3A"/><rect class="bar" x="146" y="17" height="5" rx="2.5" fill="#E5484D" opacity=".75"/><text class="mono dim" x="298" y="25" font-size="9" text-anchor="end" letter-spacing="1.4">HW FEED</text></svg>