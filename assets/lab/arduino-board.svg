<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Animated Arduino Uno board, powered on and running">
<title>Arduino Uno - powered on</title>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/>
  </linearGradient>
  <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00A9B1"/><stop offset=".55" stop-color="#00979D"/><stop offset="1" stop-color="#00767B"/>
  </linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#17293C" stroke-width="1"/>
  </pattern>
  <radialGradient id="gGreen"><stop offset="0" stop-color="#35D07F" stop-opacity=".85"/><stop offset="1" stop-color="#35D07F" stop-opacity="0"/></radialGradient>
  <radialGradient id="gAmber"><stop offset="0" stop-color="#E8A33D" stop-opacity=".85"/><stop offset="1" stop-color="#E8A33D" stop-opacity="0"/></radialGradient>
  <radialGradient id="gYellow"><stop offset="0" stop-color="#FFC65C" stop-opacity=".85"/><stop offset="1" stop-color="#FFC65C" stop-opacity="0"/></radialGradient>
  <radialGradient id="gBlue"><stop offset="0" stop-color="#4C8DF6" stop-opacity=".8"/><stop offset="1" stop-color="#4C8DF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gTeal"><stop offset="0" stop-color="#4DD0D6" stop-opacity=".55"/><stop offset="1" stop-color="#4DD0D6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gWhite"><stop offset="0" stop-color="#E6F2F5" stop-opacity=".7"/><stop offset="1" stop-color="#E6F2F5" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .silk{fill:#EAF7F8;opacity:.72}
  .lbl{fill:#8FA3B0}
  .trace{fill:none;stroke:#C9A227;stroke-width:2.4;opacity:.45;stroke-linecap:round;stroke-linejoin:round}
  .glow{fill:none;stroke:#5FE3EA;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
        stroke-dasharray:13 87;animation:flow 2.6s linear infinite}
  @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .breathe{animation:br 2.6s ease-in-out infinite alternate}
  @keyframes br{from{opacity:.62}to{opacity:1}}
  .blinkL{animation:bl 2s ease-in-out infinite}
  @keyframes bl{0%,46%{opacity:1}54%,100%{opacity:.08}}
  .tx{animation:ftx 1.7s linear infinite}
  @keyframes ftx{0%{opacity:.08}5%{opacity:1}9%{opacity:.18}13%{opacity:.92}19%{opacity:.12}25%{opacity:.8}30%{opacity:.08}100%{opacity:.08}}
  .rx{animation:frx 2.3s linear infinite}
  @keyframes frx{0%,38%{opacity:.08}43%{opacity:1}47%{opacity:.18}53%{opacity:.88}59%{opacity:.12}65%{opacity:.72}70%{opacity:.08}100%{opacity:.08}}
  .pad{animation:padOn 2.6s ease-in-out infinite;opacity:.2}
  @keyframes padOn{0%,100%{opacity:.2}10%{opacity:1}26%{opacity:.2}}
  .halo{animation:halo 5s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.14}50%{opacity:.42}}
  .core{animation:core 3.2s ease-in-out infinite}
  @keyframes core{0%,100%{opacity:.1}50%{opacity:.34}}
  .dot{animation:dotp 2.2s ease-in-out infinite}
  @keyframes dotp{0%,100%{opacity:.25}50%{opacity:1}}
  .p1{animation:d1 17s linear infinite}
  @keyframes d1{from{transform:translate(0,0);opacity:0}10%{opacity:.7}90%{opacity:.7}to{transform:translate(70px,-42px);opacity:0}}
  .p2{animation:d2 21s linear infinite}
  @keyframes d2{from{transform:translate(0,0);opacity:0}10%{opacity:.6}90%{opacity:.6}to{transform:translate(-58px,36px);opacity:0}}
  .p3{animation:d3 25s linear infinite}
  @keyframes d3{from{transform:translate(0,0);opacity:0}10%{opacity:.5}90%{opacity:.5}to{transform:translate(46px,52px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

