<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 268" width="840" height="268" role="img" aria-label="Serial monitor window with example output streaming in"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/></linearGradient></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.r0{animation:r0 13.0s ease-out infinite;opacity:0}@keyframes r0{0%,4.62%{opacity:0}5.62%,90%{opacity:1}95%,100%{opacity:0}}.r1{animation:r1 13.0s ease-out infinite;opacity:0}@keyframes r1{0%,14.23%{opacity:0}15.23%,90%{opacity:1}95%,100%{opacity:0}}.r2{animation:r2 13.0s ease-out infinite;opacity:0}@keyframes r2{0%,23.85%{opacity:0}24.85%,90%{opacity:1}95%,100%{opacity:0}}.r3{animation:r3 13.0s ease-out infinite;opacity:0}@keyframes r3{0%,33.46%{opacity:0}34.46%,90%{opacity:1}95%,100%{opacity:0}}.r4{animation:r4 13.0s ease-out infinite;opacity:0}@keyframes r4{0%,43.08%{opacity:0}44.08%,90%{opacity:1}95%,100%{opacity:0}}.r5{animation:r5 13.0s ease-out infinite;opacity:0}@keyframes r5{0%,52.69%{opacity:0}53.69%,90%{opacity:1}95%,100%{opacity:0}}.r6{animation:r6 13.0s ease-out infinite;opacity:0}@keyframes r6{0%,62.31%{opacity:0}63.31%,90%{opacity:1}95%,100%{opacity:0}}.cur{animation:cur 1.05s steps(1,end) infinite}@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}.lnk{animation:lnk 2.4s ease-in-out infinite}@keyframes lnk{0%,100%{opacity:.28}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}[class^='r']{opacity:1!important}}</style><rect width="840" height="268" rx="10" fill="url(#bg)"/><rect x=".8" y=".8" width="838.4" height="266.4" rx="10" fill="none" stroke="#16354A" stroke-width="1.6"/><path d="M1 44H839" stroke="#16354A" stroke-width="1.4"/><rect x="1" y="1" width="838" height="43" rx="10" fill="#152232"/><rect x="1" y="30" width="838" height="14" fill="#152232"/><circle cx="26" cy="23" r="5" fill