<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 34" width="1000" height="34" role="img" aria-label="Animated circuit trace divider with a travelling pulse"><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.fl{fill:none;stroke:#5FE3EA;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:10 90;animation:fl 4.5s linear infinite}@keyframes fl{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}.v{animation:v 4.5s ease-in-out infinite;opacity:.35}@keyframes v{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M20 17 H980" fill="none" stroke="#1F4257" stroke-width="2.2" stroke-linecap="round"/><path class="fl" pathLength="100" d="M20 17 H980"/><circle class="v" cx="120" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:0.00s"/><circle class="v" cx="240" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:0.50s"/><circle class="v" cx="360" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:1.00s"/><circle class="v" cx="480" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:1.50s"/><circle class="v" cx="600" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:2.00s"/><circle class="v" cx="720" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:2.50s"/><circle class="v" cx="840" cy="17" r="4.5" fill="#0A101A" stroke="#4DD0D6" stroke-width="1.6" style="animation-delay:3.00s"/><circle cx="20" cy="17" r="5" fill="#0A101A" stroke="#00979D" stroke-width="2"/><circle cx="980" cy="17" r="5" fill="#0A101A" stroke="#00979D" stroke-width="2"/></svg>