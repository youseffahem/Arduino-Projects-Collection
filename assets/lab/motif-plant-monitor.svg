<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140" role="img" aria-label="Soil moisture falling past an alert threshold, then recovering"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101B27"/><stop offset="1" stop-color="#0A101A"/></linearGradient><radialGradient id="pa"><stop offset="0" stop-color="#E5484D" stop-opacity=".9"/><stop offset="1" stop-color="#E5484D" stop-opacity="0"/></radialGradient></defs><style>.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lbl{fill:#8FA3B0}.dim{fill:#5E6E7A}.lvl{transform-box:fill-box;transform-origin:center bottom;animation:lv 14s ease-in-out infinite}@keyframes lv{0%{transform:scaleY(1)}42%,58%{transform:scaleY(.25)}80%,100%{transform:scaleY(1)}}.alert{animation:al 14s ease-in-out infinite}@keyframes al{0%,36%{opacity:.12}46%,62%{opacity:1}72%,100%{opacity:.12}}.okled{animation:ok 14s ease-in-out infinite}@keyframes ok{0%,32%{opacity:1}42%,66%{opacity:.12}78%,100%{opacity:1}}.drop{animation:dr 14s ease-in-out infinite;opacity:0}@keyframes dr{0%,64%{opacity:0}70%{opacity:1}82%{opacity:0}100%{opacity:0}}.fl{fill:none;stroke:#35D07F;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:12 88;animation:fl 3.2s linear infinite}@keyframes fl{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="540" height="140" rx="9" fill="url(#bg)"/><rect x=".8" y=".8" width="538.4" height="138.4" rx="9" fill="none" stroke="#16354A" stroke-width="1.6"/><text class="mono" x="20" y="24" font-size="10" fill="#4DD0D6" letter-spacing="2">EXP-05 &#183; SOIL MOISTURE</text><rect x="34" y="44" width="86" height="72" rx="5" fill="#2A2018" stroke="#4A3A2A" stroke-width="1.4"/><rect class="lvl" x="34" y="44" width="86" height="56" fill="#3E6B4A" opacity=".55"/><path d="M77 44V22M77 30c-8-6-16-4-18 2 7 3 14 2 18-2M77 34c8-6 16-3 18 3-7 3-15 1-18-3" fill="none" stroke="#35D07F" stroke-width="1.8" stroke-linejoin="round"/><rect x="66" y="60" width="6" height="46" rx="2" fill="#8FA3B0"/><rect x="82" y="60" width="6" height="46" rx="2" fill="#8FA3B0"/><g class="drop"><circle cx="52" cy="34" r="3" fill="#4C8DF6"/><circle cx="104" cy="26" r="2.5" fill="#4C8DF6"/></g><text class="mono dim" x="77" y="132" font-size="9" text-anchor="middle">FC-28 probe</text><path d="M124 80H206" stroke="#1F4257" stroke-width="2.4"/><path class="fl" pathLength="100" d="M124 80H206"/><rect x="210" y="56" width="118" height="48" rx="5" fill="#12202B" stroke="#00C2CA" stroke-width="1.6"/><text class="mono" x="269" y="76" font-size="9.5" fill="#C9D6DF" text-anchor="middle">analogRead(A0)</text><text class="mono dim" x="269" y="92" font-size="9" text-anchor="middle">threshold 900</text><path d="M332 80H392" stroke="#1F4257" stroke-width="2.4"/><path class="fl" pathLength="100" d="M332 80H392" style="animation-delay:-1.6s"/><circle class="alert" cx="424" cy="62" r="24" fill="url(#pa)"/><circle class="alert" cx="424" cy="62" r="9" fill="#E5484D"/><text class="mono dim" x="444" y="66" font-size="9">ALERT D13</text><circle class="alert" cx="424" cy="102" r="11" fill="none" stroke="#4C8DF6" stroke-width="2"/><circle class="alert" cx="424" cy="102" r="4" fill="#4C8DF6"/><text class="mono dim" x="444" y="106" font-size="9">BUZZ D11</text><circle class="okled" cx="508" cy="24" r="4.5" fill="#35D07F"/><text class="mono" x="498" y="28" font-size="9" fill="#3E5464" text-anchor="end" letter-spacing="1.2">ILLUSTRATIVE</text></svg>